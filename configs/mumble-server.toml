# go-mumble-server bootstrap configuration
#
# This file is used for initial seeding only. On first run, values from this file
# are written to the SQLite database. After that, runtime settings are managed via
# the REST API (GET/PATCH /api/v1/meta/config, /api/v1/servers/:id/config) or the
# web management UI. Only database.path, tls.cert, tls.key, logging.level, and
# frontend-embed (flag) remain in this file permanently.

[network]
# Mumble protocol port (TCP + UDP)
port = 64738
# REST management API port
rest_port = 64730
# Bind address for the Mumble voice/control listener (reachable by clients)
host = "0.0.0.0"
# Bind address for the ADMIN REST API. Defaults to loopback so the management
# plane is NOT exposed on every interface like the voice port. Bootstrap-only
# (restart to change; not editable via the REST API). For remote admin, put a
# reverse proxy (e.g. Caddy) in front. Set "0.0.0.0" only if you understand why.
rest_host = "127.0.0.1"

[tls]
# TLS certificate and key (PEM format)
# If not set, a self-signed certificate is generated on first run
# cert = "/etc/go-mumble-server/mumble-server.crt"
# key = "/etc/go-mumble-server/mumble-server.key"

[server]
# Maximum concurrent users (0 = unlimited)
max_users = 100
# Maximum bandwidth per user in bits/sec
max_bandwidth = 72000
# Server welcome message (HTML)
welcome_text = ""
# Server password (empty = no password)
server_password = ""

[database]
# SQLite database path
path = "mumble-server.sqlite"

[logging]
# Log level: debug, info, warn, error
level = "info"

[channels]
# Maximum channel nesting depth
nesting_limit = 10
# Maximum total channels
count_limit = 1000

[users]
# Default channel ID for new connections
default_channel = 0
# Require client certificates
cert_required = false

[bonjour]
# Enable mDNS/Bonjour LAN discovery
enabled = false
# Display name for LAN discovery
register_name = "go-mumble-server"
